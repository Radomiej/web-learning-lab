<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" style="background-color:#ffffff" shape-rendering="geometricPrecision">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#000000">Dwa sposoby układania elementów</text>
  <g stroke="#000000" stroke-width="3" fill="#ffffff">
    <rect x="45" y="85" width="410" height="350" rx="10"/>
    <rect x="545" y="85" width="410" height="350" rx="10"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#000000">
    <text x="250" y="130" font-size="27" font-weight="700">Flexbox</text>
    <text x="250" y="158" font-size="19">jedna główna oś</text>
    <text x="750" y="130" font-size="27" font-weight="700">Grid</text>
    <text x="750" y="158" font-size="19">wiersze i kolumny</text>
  </g>
  <g stroke="#000000" stroke-width="3" fill="#eeeeee">
    <rect x="80" y="225" width="95" height="75"/>
    <rect x="205" y="225" width="95" height="75"/>
    <rect x="330" y="225" width="95" height="75"/>
    <rect x="580" y="200" width="95" height="75"/>
    <rect x="705" y="200" width="95" height="75"/>
    <rect x="830" y="200" width="95" height="75"/>
    <rect x="580" y="305" width="95" height="75"/>
    <rect x="705" y="305" width="95" height="75"/>
    <rect x="830" y="305" width="95" height="75"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#000000" font-size="22" font-weight="700">
    <text x="127" y="270">1</text><text x="252" y="270">2</text><text x="377" y="270">3</text>
    <text x="627" y="245">1</text><text x="752" y="245">2</text><text x="877" y="245">3</text>
    <text x="627" y="350">4</text><text x="752" y="350">5</text><text x="877" y="350">6</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#000000" font-size="17">
    <text x="250" y="390">menu, przyciski, wyrównanie</text>
    <text x="750" y="410">karty, kolumny, układ strony</text>
  </g>
