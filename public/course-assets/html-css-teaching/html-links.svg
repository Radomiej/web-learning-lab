<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Fragment adresu wskazuje id</title><desc id="desc">href zawiera #podlewanie; id zawiera podlewanie bez #. Aktywacja linku przechodzi do tego nagłówka w tym samym dokumencie.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Fragment adresu wskazuje id</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;a href=&quot;#podlewanie&quot;&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> Podlewanie</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/a&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"></text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;h2 id=&quot;podlewanie&quot;&gt;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> Jak podlewać?</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/h2&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="188" font-size="26" fill="#1d4ed8" text-decoration="underline">Podlewanie</text><text x="582" y="246" font-size="22" fill="#16324f" >↓ aktywuj link</text><rect x="576" y="282" width="476" height="130" fill="#eef5ff" /><text x="590" y="330" font-size="33" fill="#16324f" font-weight="700">Jak podlewać?</text><text x="590" y="377" font-size="20" fill="#16324f" >cel: id=&quot;podlewanie&quot;</text><text x="32" y="572" font-size="21" fill="#16324f" >href zawiera #podlewanie; id zawiera podlewanie bez #. Aktywacja linku przechodzi do</text><text x="32" y="600" font-size="21" fill="#16324f" >tego nagłówka w tym samym dokumencie.</text></g></svg>