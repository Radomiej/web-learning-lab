<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">border-box wlicza padding i ramkę</title><desc id="desc">Rysunek ma skalę 2:1. Zmienia się tylko box-sizing. Pudełko z ramką maleje z 228px do 200px. Padding 12px i border 2px z każdej strony pozostają.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">border-box wlicza padding i ramkę</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.card {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> width: 200px;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> padding: 12px;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> border: 2px solid navy;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> box-sizing: border-box;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="178" font-size="21" fill="#16324f" >PRZED: content-box → 228px</text><rect x="582" y="195" width="456" height="78" fill="#b9e5f8" stroke="navy" stroke-width="4"/><rect x="610" y="223" width="400" height="22" fill="#fff" /><text x="582" y="326" font-size="21" fill="#16324f" >PO: border-box → 200px</text><rect x="582" y="345" width="400" height="78" fill="#b9e5f8" stroke="navy" stroke-width="4"/><rect x="610" y="373" width="344" height="22" fill="#fff" /><text x="582" y="475" font-size="23" fill="#16324f" >Treść: 200 − 24 − 4 = 172px</text><text x="32" y="572" font-size="21" fill="#16324f" >Rysunek ma skalę 2:1. Zmienia się tylko box-sizing. Pudełko z ramką maleje z 228px do</text><text x="32" y="600" font-size="21" fill="#16324f" >200px. Padding 12px i border 2px z każdej strony pozostają.</text></g></svg>