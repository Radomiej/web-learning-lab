<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">order i align-self wyłamują pojedyncze elementy</title><desc id="desc">Element z order:-1 pojawia się jako pierwszy w widoku, a align-self:flex-end przykleja go do dolnej krawędzi kontenera.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">order i align-self wyłamują pojedyncze elementy</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: flex;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  min-height: 300px;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.item:last-child {</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  order: -1;</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  align-self: flex-end;</text><text x="50" y="384" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="444" font-size="19" fill="#9bdcf5">HTML nadal czyta: 1, 2, 3 —</text><text x="50" y="474" font-size="19" fill="#9bdcf5">zmienia się tylko widok.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><rect x="578" y="140" width="466" height="330" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><text x="590" y="166" font-size="17" fill="#7fa6c2">.practice</text><rect x="596" y="362" width="140" height="80" fill="#f4c95d" stroke="#16324f" stroke-width="2" rx="8"/><text x="656" y="409" font-size="20" fill="#16324f">3</text><rect x="748" y="196" width="140" height="246" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="808" y="326" font-size="20" fill="#16324f">1</text><rect x="900" y="196" width="140" height="246" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="960" y="326" font-size="20" fill="#16324f">2</text><text x="590" y="498" font-size="18" fill="#16324f">Trójka skacze na początek osi (order)</text><text x="590" y="524" font-size="18" fill="#16324f">i siada przy dolnej krawędzi (align-self).</text><text x="32" y="572" font-size="21" fill="#16324f">align-self nadpisuje align-items tylko dla jednego dziecka; order rusza</text><text x="32" y="600" font-size="21" fill="#16324f">wyłącznie kolejność wizualną — DOM pozostaje nietknięty.</text></g></svg>
