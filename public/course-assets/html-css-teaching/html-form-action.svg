<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">action prowadzi do odbiornika na serwerze</title><desc id="desc">Schemat dotyczy działającego hostingu PHP. action wskazuje odbiornik, a nie tworzy serwera. Odczyt żądania nie oznacza automatycznego zapisu do bazy.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">action prowadzi do odbiornika na serwerze</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;form action=&quot;profil.php&quot; method=&quot;post&quot;&gt;</text><text x="50" y="204" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;label for=&quot;nick&quot;&gt;Pseudonim&lt;/label&gt;</text><text x="50" y="234" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;input id=&quot;nick&quot; name=&quot;nick&quot;</text><text x="50" y="264" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  value=&quot;Luna&quot;&gt;</text><text x="50" y="294" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;button type=&quot;submit&quot;&gt;Wyślij&lt;/button&gt;</text><text x="50" y="324" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/form&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="171" font-size="25" fill="#16324f" >1. Przeglądarka: Wyślij</text><rect x="582" y="192" width="445" height="70" fill="#e0f2fe" rx="8"/><text x="600" y="235" font-size="24" fill="#16324f" >POST profil.php · nick=Luna</text><text x="582" y="304" font-size="22" fill="#16324f" >↓ nowe żądanie HTTP</text><text x="582" y="353" font-size="24" fill="#16324f" >2. Serwer uruchamia profil.php</text><text x="582" y="396" font-size="23" fill="#16324f" >$_POST[&quot;nick&quot;] → &quot;Luna&quot;</text><text x="582" y="459" font-size="22" fill="#16324f" >3. Odpowiedź HTML → przeglądarka</text><text x="32" y="572" font-size="21" fill="#16324f" >Schemat dotyczy działającego hostingu PHP. action wskazuje odbiornik, a nie tworzy</text><text x="32" y="600" font-size="21" fill="#16324f" >serwera. Odczyt żądania nie oznacza automatycznego zapisu do bazy.</text></g></svg>