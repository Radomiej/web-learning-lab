<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">display: flex ustawia jedną oś układu</title><desc id="desc">Reguła na kontenerze .practice włącza flexbox. Dzieci .item układają się wzdłuż osi głównej, a align-items steruje osią poprzeczną.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">display: flex ustawia jedną oś układu</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: flex;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-direction: row;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  justify-content: center;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  align-items: center;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="384" font-size="19" fill="#9bdcf5" xml:space="preserve">Kontener ma class=&quot;practice&quot;,</text><text x="50" y="414" font-size="19" fill="#9bdcf5">dzieci mają class=&quot;item&quot;.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><rect x="578" y="150" width="466" height="260" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><text x="590" y="176" font-size="17" fill="#7fa6c2">.practice</text><rect x="650" y="235" width="100" height="80" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="681" y="281" font-size="20" fill="#16324f">1</text><rect x="762" y="235" width="100" height="80" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="793" y="281" font-size="20" fill="#16324f">2</text><rect x="874" y="235" width="100" height="80" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="905" y="281" font-size="20" fill="#16324f">3</text><line x1="650" y1="350" x2="974" y2="350" stroke="#d97706" stroke-width="3" marker-end="url(#arrowH)"/><text x="762" y="378" font-size="18" fill="#b45309">oś główna</text><line x1="614" y1="370" x2="614" y2="195" stroke="#d97706" stroke-width="3" marker-end="url(#arrowV)"/><text x="596" y="395" font-size="18" fill="#b45309">oś poprzeczna</text><text x="572" y="475" font-size="21" fill="#16324f">Dzieci ustawiają się w jednym wierszu —</text><text x="572" y="503" font-size="21" fill="#16324f">bez floatów i sztuczek z inline-block.</text><defs><marker id="arrowH" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker></defs><text x="32" y="572" font-size="21" fill="#16324f">Oś główna wyznacza kierunek rozmieszczania; oś poprzeczna jest do niej</text><text x="32" y="600" font-size="21" fill="#16324f">prostopadła i odpowiada za wyrównanie w drugim wymiarze.</text></g></svg>
