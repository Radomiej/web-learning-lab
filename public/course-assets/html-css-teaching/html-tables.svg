<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Komórki tworzą wiersze i kolumny</title><desc id="desc">Pierwszy tr zawiera nagłówki, drugi dane. Liczba 3 znajduje się w kolumnie Doniczki, obok nazwy Mięta. Domyślna tabela nie ma ramki.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Komórki tworzą wiersze i kolumny</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;table&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;tr&gt;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;th&gt;Zioło&lt;/th&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;th&gt;Doniczki&lt;/th&gt;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;/tr&gt;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;tr&gt;&lt;td&gt;Mięta&lt;/td&gt;</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">     &lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;</text><text x="50" y="384" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/table&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="595" y="209" font-size="28" fill="#16324f" font-weight="700">Zioło</text><text x="810" y="209" font-size="28" fill="#16324f" font-weight="700">Doniczki</text><text x="595" y="270" font-size="28" fill="#16324f" >Mięta</text><text x="855" y="270" font-size="28" fill="#16324f" >3</text><text x="582" y="370" font-size="22" fill="#16324f" >2 wiersze × 2 kolumny</text><text x="582" y="410" font-size="21" fill="#16324f" >Bez automatycznej ramki.</text><text x="32" y="572" font-size="21" fill="#16324f" >Pierwszy tr zawiera nagłówki, drugi dane. Liczba 3 znajduje się w kolumnie Doniczki,</text><text x="32" y="600" font-size="21" fill="#16324f" >obok nazwy Mięta. Domyślna tabela nie ma ramki.</text></g></svg>