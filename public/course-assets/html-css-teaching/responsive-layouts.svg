<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Elastyczny układ zawija się sam</title><desc id="desc">Szeroki kontener mieści trzy elementy .item w wierszu. Wąski kontener z tymi samymi regułami układa je jeden pod drugim dzięki flex-wrap i flex-basis.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Elastyczny układ zawija się sam</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: flex;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-wrap: wrap;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  gap: 16px;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.item {</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-basis: 100px;</text><text x="50" y="384" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-grow: 1;</text><text x="50" y="414" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="474" font-size="19" fill="#9bdcf5">Te same reguły — inna szerokość</text><text x="50" y="504" font-size="19" fill="#9bdcf5">kontenera, inny kształt układu.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><text x="578" y="158" font-size="17" fill="#16324f">SZEROKI KONTENER</text><rect x="578" y="170" width="466" height="120" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="592" y="184" width="142" height="92" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="654" y="236" font-size="20" fill="#16324f">1</text><rect x="746" y="184" width="142" height="92" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="808" y="236" font-size="20" fill="#16324f">2</text><rect x="900" y="184" width="132" height="92" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="956" y="236" font-size="20" fill="#16324f">3</text><text x="578" y="330" font-size="17" fill="#16324f">WĄSKI KONTENER — te same reguły</text><rect x="578" y="342" width="240" height="160" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="590" y="352" width="216" height="42" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="688" y="379" font-size="17" fill="#16324f">1</text><rect x="590" y="400" width="216" height="42" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="688" y="427" font-size="17" fill="#16324f">2</text><rect x="590" y="448" width="216" height="42" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="688" y="475" font-size="17" fill="#16324f">3</text><text x="32" y="572" font-size="21" fill="#16324f">flex-wrap plus minimalna baza zamiast sztywnych szerokości — elementy</text><text x="32" y="600" font-size="21" fill="#16324f">same decydują, czy mieszczą się w wierszu, czy schodzą niżej.</text></g></svg>
