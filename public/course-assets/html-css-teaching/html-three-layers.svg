<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Znacznik określa rolę treści</title><desc id="desc">h1 tworzy główny nagłówek, p osobny akapit. Znaczniki nie są wyświetlane. Pokazano przykładowy domyślny wygląd bez CSS autora.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Znacznik określa rolę treści</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;h1&gt;Ogród&lt;/h1&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;p&gt;Posiejmy zioła.&lt;/p&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="205" font-size="42" fill="#16324f" font-weight="700">Ogród</text><text x="582" y="258" font-size="24" fill="#16324f" >Posiejmy zioła.</text><text x="32" y="572" font-size="21" fill="#16324f" >h1 tworzy główny nagłówek, p osobny akapit. Znaczniki nie są wyświetlane. Pokazano</text><text x="32" y="600" font-size="21" fill="#16324f" >przykładowy domyślny wygląd bez CSS autora.</text></g></svg>