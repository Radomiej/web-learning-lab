<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">color zmienia tekst, nie jego treść</title><desc id="desc">Selektor p wybiera akapit. Właściwość color zmienia jego tekst na navy (#000080). Napis Mięta i struktura dokumentu pozostają takie same.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">color zmienia tekst, nie jego treść</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">/* HTML: &lt;p&gt;Mięta&lt;/p&gt; */</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">p { color: navy; }</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="180" font-size="19" fill="#16324f" >PRZED</text><text x="582" y="233" font-size="36" fill="#202020" >Mięta</text><text x="582" y="325" font-size="19" fill="#16324f" >PO: color: navy</text><text x="582" y="380" font-size="36" fill="#000080" >Mięta</text><text x="32" y="572" font-size="21" fill="#16324f" >Selektor p wybiera akapit. Właściwość color zmienia jego tekst na navy (#000080). Napis</text><text x="32" y="600" font-size="21" fill="#16324f" >Mięta i struktura dokumentu pozostają takie same.</text></g></svg>