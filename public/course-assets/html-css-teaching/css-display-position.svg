<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">display:block rozpoczyna nowy wiersz</title><desc id="desc">Dwa span domyślnie uczestniczą w tym samym wierszu. display:block powoduje rozpoczęcie osobnych wierszy. Nie dopisujemy br ani nowych liter.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">display:block rozpoczyna nowy wiersz</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">/* HTML: */</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">/* &lt;span&gt;A&lt;/span&gt;&lt;span&gt;B&lt;/span&gt; */</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">span { display: block; }</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="179" font-size="21" fill="#16324f" >PRZED: inline</text><text x="582" y="230" font-size="34" fill="#16324f" >AB</text><text x="582" y="320" font-size="21" fill="#16324f" >PO: block</text><text x="582" y="370" font-size="34" fill="#16324f" >A</text><text x="582" y="418" font-size="34" fill="#16324f" >B</text><text x="32" y="572" font-size="21" fill="#16324f" >Dwa span domyślnie uczestniczą w tym samym wierszu. display:block powoduje rozpoczęcie</text><text x="32" y="600" font-size="21" fill="#16324f" >osobnych wierszy. Nie dopisujemy br ani nowych liter.</text></g></svg>