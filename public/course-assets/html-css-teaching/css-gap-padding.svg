<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">padding od brzegu, gap między dziećmi</title><desc id="desc">Na rysunku padding 12px to 24 jednostki, gap 16px to 32 jednostki. Padding otacza zawartość, gap oddziela dzieci; nie dodaje odstępu przed A ani za B.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">padding od brzegu, gap między dziećmi</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.list {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> display: flex;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> gap: 16px;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> padding: 12px;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="178" font-size="21" fill="#16324f" >Kontener flex, schemat w skali 2:1</text><rect x="582" y="223" width="448" height="146" fill="#e0f2fe" stroke="#16324f" stroke-width="2"/><rect x="606" y="247" width="184" height="98" fill="#fff" stroke="#16324f"/><rect x="822" y="247" width="184" height="98" fill="#fff" stroke="#16324f"/><text x="682" y="308" font-size="28" fill="#16324f" >A</text><text x="901" y="308" font-size="28" fill="#16324f" >B</text><text x="582" y="410" font-size="22" fill="#16324f" >Od brzegu do A: 12px padding</text><text x="582" y="455" font-size="22" fill="#16324f" >Od A do B: 16px gap</text><text x="32" y="572" font-size="21" fill="#16324f" >Na rysunku padding 12px to 24 jednostki, gap 16px to 32 jednostki. Padding otacza</text><text x="32" y="600" font-size="21" fill="#16324f" >zawartość, gap oddziela dzieci; nie dodaje odstępu przed A ani za B.</text></g></svg>