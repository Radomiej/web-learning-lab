<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Obraz i widoczny podpis</title><desc id="desc">figure grupuje obraz i figcaption. Podpis widać pod obrazem. alt opisuje jego sens, ale nie jest drugim podpisem. Plik src musi istnieć.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Obraz i widoczny podpis</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;figure&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;img src=&quot;mieta.jpg&quot;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  alt=&quot;Ząbkowane liście mięty&quot;&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;figcaption&gt;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  Mięta w szkolnym ogrodzie.</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;/figcaption&gt;</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/figure&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><rect x="582" y="155" width="450" height="215" fill="#dcf3df" /><path d="M800 345 Q720 245 660 190 Q790 170 805 300 Q830 175 965 195 Q900 290 805 320" fill="#287548" stroke="#16324f" stroke-width="3"/><text x="582" y="413" font-size="24" fill="#16324f" >Mięta w szkolnym ogrodzie.</text><text x="582" y="470" font-size="19" fill="#16324f" >Schemat zastępujący zdjęcie.</text><text x="32" y="572" font-size="21" fill="#16324f" >figure grupuje obraz i figcaption. Podpis widać pod obrazem. alt opisuje jego sens, ale</text><text x="32" y="600" font-size="21" fill="#16324f" >nie jest drugim podpisem. Plik src musi istnieć.</text></g></svg>