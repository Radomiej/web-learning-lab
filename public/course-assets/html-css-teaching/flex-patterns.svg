<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Nawigacja: space-between i gap</title><desc id="desc">Pasek nav z display:flex rozpycha logo i linki na przeciwne krańce; gap pilnuje równych odstępów między linkami.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Nawigacja: space-between i gap</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">nav {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: flex;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  justify-content: space-between;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  align-items: center;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  gap: 8px;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="384" font-size="19" fill="#9bdcf5">Skrajne elementy na krańcach,</text><text x="50" y="414" font-size="19" fill="#9bdcf5">odstępy pod kontrolą gap.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><rect x="578" y="150" width="466" height="120" fill="#16324f" rx="10"/><text x="592" y="176" font-size="17" fill="#9bdcf5">nav</text><rect x="592" y="192" width="110" height="56" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="612" y="227" font-size="18" fill="#16324f">LOGO</text><rect x="768" y="192" width="76" height="56" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="786" y="227" font-size="17" fill="#16324f">Start</text><rect x="852" y="192" width="86" height="56" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="868" y="227" font-size="17" fill="#16324f">Oferta</text><rect x="946" y="192" width="90" height="56" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="958" y="227" font-size="17" fill="#16324f">Kontakt</text><text x="578" y="316" font-size="17" fill="#16324f">INNE WZORCE TEJ LEKCJI</text><rect x="578" y="330" width="466" height="76" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="750" y="344" width="80" height="48" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="762" y="374" font-size="15" fill="#16324f">Zapisz</text><rect x="838" y="344" width="80" height="48" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="850" y="374" font-size="15" fill="#16324f">Anuluj</text><rect x="926" y="344" width="108" height="48" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="936" y="374" font-size="15" fill="#16324f">Opublikuj</text><text x="588" y="372" font-size="16" fill="#7fa6c2">toolbar → flex-end</text><rect x="578" y="418" width="466" height="76" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="592" y="432" width="140" height="48" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><rect x="742" y="432" width="140" height="48" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><rect x="892" y="432" width="140" height="48" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="32" y="572" font-size="21" fill="#16324f">Ten sam układ napędza nawigację, pasek narzędzi, siatkę kart i panel</text><text x="32" y="600" font-size="21" fill="#16324f">boczny — zmieniają się tylko kierunek osi i wartości wyrównań.</text></g></svg>
