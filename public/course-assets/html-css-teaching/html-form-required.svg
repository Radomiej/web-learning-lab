<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">required zatrzymuje pusty formularz</title><desc id="desc">Zapisz uruchamia sprawdzenie. required odrzuca pustą wartość, type=email sprawdza format. Wygląd i tekst komunikatu zależą od przeglądarki; serwer nadal musi walidować dane.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">required zatrzymuje pusty formularz</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="18.895599654874893" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;form&gt;</text><text x="50" y="204" font-size="18.895599654874893" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;label for=&quot;email&quot;&gt;E-mail&lt;/label&gt;</text><text x="50" y="234" font-size="18.895599654874893" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;input id=&quot;email&quot; name=&quot;email&quot;</text><text x="50" y="264" font-size="18.895599654874893" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  type=&quot;email&quot; required&gt;</text><text x="50" y="294" font-size="18.895599654874893" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;button type=&quot;submit&quot;&gt;Zapisz&lt;/button&gt;</text><text x="50" y="324" font-size="18.895599654874893" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/form&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="172" font-size="25" fill="#16324f" >E-mail</text><rect x="582" y="190" width="445" height="54" fill="#fff" rx="5" stroke="#c2410c" stroke-width="3"/><rect x="582" y="263" width="170" height="52" fill="#e0f2fe" rx="6" stroke="#16324f"/><text x="612" y="298" font-size="25" fill="#16324f" >Zapisz</text><rect x="582" y="340" width="445" height="88" fill="#fff7ed" rx="8" stroke="#c2410c"/><text x="598" y="376" font-size="21" fill="#16324f" >Puste pole → wysyłanie zatrzymane</text><text x="598" y="407" font-size="18" fill="#16324f" >Przykładowy komunikat walidacji.</text><text x="582" y="481" font-size="22" fill="#16324f" >kot → błąd formatu e-mail</text><text x="32" y="572" font-size="21" fill="#16324f" >Zapisz uruchamia sprawdzenie. required odrzuca pustą wartość, type=email sprawdza</text><text x="32" y="600" font-size="21" fill="#16324f" >format. Wygląd i tekst komunikatu zależą od przeglądarki; serwer nadal musi walidować</text><text x="32" y="628" font-size="21" fill="#16324f" >dane.</text></g></svg>