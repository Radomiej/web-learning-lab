<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">flex-wrap przenosi elementy do nowego wiersza</title><desc id="desc">Kontener .practice z flex-wrap:wrap zawija nadmiar elementów. row-gap i column-gap ustawiają osobne odstępy między wierszami i kolumnami.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">flex-wrap przenosi elementy do nowego wiersza</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: flex;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-wrap: wrap;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  row-gap: 24px;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  column-gap: 12px;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.item { flex-basis: 140px; }</text><text x="50" y="414" font-size="19" fill="#9bdcf5">Baza 140px: elementy nie kurczą się,</text><text x="50" y="444" font-size="19" fill="#9bdcf5">tylko przechodzą do nowego wiersza.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><rect x="578" y="140" width="466" height="330" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><text x="590" y="166" font-size="17" fill="#7fa6c2">.practice</text><rect x="596" y="186" width="140" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="656" y="229" font-size="20" fill="#16324f">1</text><rect x="748" y="186" width="140" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="808" y="229" font-size="20" fill="#16324f">2</text><rect x="900" y="186" width="140" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="960" y="229" font-size="20" fill="#16324f">3</text><rect x="596" y="280" width="140" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="656" y="323" font-size="20" fill="#16324f">4</text><rect x="748" y="280" width="140" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="808" y="323" font-size="20" fill="#16324f">5</text><text x="736" y="262" font-size="16" fill="#b45309">↕ 24</text><text x="742" y="210" font-size="14" fill="#b45309">12 ↔</text><text x="596" y="400" font-size="18" fill="#16324f">Czwarty i piąty element nie mieszczą się</text><text x="596" y="426" font-size="18" fill="#16324f">w pierwszym wierszu — lądują niżej.</text><text x="32" y="572" font-size="21" fill="#16324f">gap dba o odstępy wyłącznie między elementami; na zewnątrz kontenera</text><text x="32" y="600" font-size="21" fill="#16324f">nie pojawia się żaden dodatkowy margines.</text></g></svg>
