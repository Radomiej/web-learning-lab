<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">name jest kluczem danych, id nim nie jest</title><desc id="desc">Wartość pola to Ala. Nazwa danych pochodzi z name=&quot;name&quot;, więc serwer otrzyma name=Ala. id=&quot;person&quot; służy etykiecie; nie tworzy klucza person.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">name jest kluczem danych, id nim nie jest</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;form action=&quot;profil.php&quot; method=&quot;post&quot;&gt;</text><text x="50" y="204" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;label for=&quot;person&quot;&gt;Imię&lt;/label&gt;</text><text x="50" y="234" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;input id=&quot;person&quot; name=&quot;name&quot;</text><text x="50" y="264" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  value=&quot;Ala&quot;&gt;</text><text x="50" y="294" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;button type=&quot;submit&quot;&gt;Wyślij&lt;/button&gt;</text><text x="50" y="324" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/form&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="176" font-size="25" fill="#16324f" >Imię</text><rect x="582" y="194" width="445" height="54" fill="#fff" rx="5" stroke="#16324f"/><text x="598" y="231" font-size="26" fill="#16324f" >Ala</text><text x="582" y="302" font-size="22" fill="#16324f" >↓ Wyślij bez zmiany wartości</text><rect x="582" y="330" width="445" height="70" fill="#dcf3df" rx="8"/><text x="602" y="375" font-size="30" fill="#16324f" font-family="Consolas, monospace">name=Ala</text><text x="582" y="464" font-size="22" fill="#16324f" >person łączy label z input.</text><text x="32" y="572" font-size="21" fill="#16324f" >Wartość pola to Ala. Nazwa danych pochodzi z name=&quot;name&quot;, więc serwer otrzyma name=Ala.</text><text x="32" y="600" font-size="21" fill="#16324f" >id=&quot;person&quot; służy etykiecie; nie tworzy klucza person.</text></g></svg>