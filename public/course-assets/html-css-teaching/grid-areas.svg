<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">grid-template-areas to mapa nazwanych obszarów</title><desc id="desc">Nazwy obszarów w cudzysłowach rysują układ: header przez dwie kolumny, side i content obok siebie. grid-area przypina element do nazwy.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">grid-template-areas to mapa nazwanych obszarów</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: grid;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  grid-template-areas:</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">    &quot;header header&quot;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">    &quot;side content&quot;;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.item:first-child {</text><text x="50" y="384" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  grid-area: header;</text><text x="50" y="414" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><rect x="578" y="140" width="466" height="330" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="592" y="156" width="438" height="110" fill="#f4c95d" stroke="#16324f" stroke-width="2" rx="8"/><text x="748" y="216" font-size="21" fill="#16324f">header</text><rect x="592" y="278" width="140" height="176" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="640" y="372" font-size="21" fill="#16324f">side</text><rect x="744" y="278" width="286" height="176" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="862" y="372" font-size="21" fill="#16324f">content</text><text x="578" y="500" font-size="21" fill="#16324f">Układ czyta się jak mapę — zmiana</text><text x="578" y="528" font-size="21" fill="#16324f">napisu zmienia całą geometrię.</text><text x="32" y="572" font-size="21" fill="#16324f">grid-column-start / grid-column-end rozpinają element między liniami</text><text x="32" y="600" font-size="21" fill="#16324f">siatki bez nadawania nazw poszczególnym obszarom.</text></g></svg>
