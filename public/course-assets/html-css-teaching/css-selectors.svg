<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Klasa zmienia tylko pasujące elementy</title><desc id="desc">Kropkę zapisujemy w selektorze .notice. W HTML jest class=&quot;notice&quot; bez kropki. Akapit bez tej klasy zachowuje swój kolor.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Klasa zmienia tylko pasujące elementy</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">/* HTML: */</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">/* &lt;p class=&quot;notice&quot;&gt;Uwaga&lt;/p&gt;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">   &lt;p&gt;Opis&lt;/p&gt; */</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.notice { color: darkred; }</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="170" font-size="19" fill="#16324f" >PRZED</text><text x="582" y="214" font-size="28" fill="#202020" >Uwaga</text><text x="582" y="254" font-size="28" fill="#202020" >Opis</text><text x="582" y="320" font-size="19" fill="#16324f" >PO</text><text x="582" y="360" font-size="28" fill="#8b0000" >Uwaga</text><text x="582" y="400" font-size="28" fill="#202020" >Opis</text><text x="582" y="475" font-size="21" fill="#16324f" >Tylko Uwaga ma klasę notice.</text><text x="32" y="572" font-size="21" fill="#16324f" >Kropkę zapisujemy w selektorze .notice. W HTML jest class=&quot;notice&quot; bez kropki. Akapit</text><text x="32" y="600" font-size="21" fill="#16324f" >bez tej klasy zachowuje swój kolor.</text></g></svg>