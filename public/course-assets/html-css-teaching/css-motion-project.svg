<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">transition wygładza zmianę tła</title><desc id="desc">transition samo nie zmienia koloru. Dopiero hover podaje nową wartość. W ciągu 200ms kolor przechodzi od #e0f2fe do #bae6fd; po zejściu wraca.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">transition wygładza zmianę tła</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">button {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> background-color: #e0f2fe;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> transition: background-color</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">   200ms ease;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">button:hover {</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> background-color: #bae6fd;</text><text x="50" y="384" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="180" font-size="21" fill="#16324f" >PRZED: bez najechania</text><rect x="582" y="203" width="240" height="64" fill="#e0f2fe" rx="8" stroke="#16324f"/><text x="609" y="246" font-size="26" fill="#16324f" >Pokaż</text><text x="582" y="322" font-size="21" fill="#16324f" >200ms po najechaniu</text><rect x="582" y="346" width="240" height="64" fill="#bae6fd" rx="8" stroke="#16324f"/><text x="609" y="389" font-size="26" fill="#16324f" >Pokaż</text><text x="582" y="469" font-size="21" fill="#16324f" >Ten sam przycisk, nowy kolor tła.</text><text x="32" y="572" font-size="21" fill="#16324f" >transition samo nie zmienia koloru. Dopiero hover podaje nową wartość. W ciągu 200ms</text><text x="32" y="600" font-size="21" fill="#16324f" >kolor przechodzi od #e0f2fe do #bae6fd; po zejściu wraca.</text></g></svg>