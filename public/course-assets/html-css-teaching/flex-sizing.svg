<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">flex-grow dzieli wolne miejsce kontenera</title><desc id="desc">Przed: trzy elementy .item po 80px i pusta reszta kontenera. Po: flex-grow:1 rozciąga je równo na całą szerokość.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">flex-grow dzieli wolne miejsce kontenera</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice { display: flex; }</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.item {</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-basis: 80px;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  flex-grow: 1;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="354" font-size="19" fill="#9bdcf5">flex-basis to punkt startowy;</text><text x="50" y="384" font-size="19" fill="#9bdcf5">flex-grow to udział w reszcie.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><text x="578" y="160" font-size="17" fill="#16324f">PRZED — sama baza</text><rect x="578" y="172" width="466" height="96" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="588" y="184" width="80" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="619" y="226" font-size="19" fill="#16324f">1</text><rect x="678" y="184" width="80" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="709" y="226" font-size="19" fill="#16324f">2</text><rect x="768" y="184" width="80" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="799" y="226" font-size="19" fill="#16324f">3</text><text x="862" y="222" font-size="16" fill="#7fa6c2">wolne miejsce →</text><text x="578" y="312" font-size="17" fill="#16324f">PO — grow: 1 u każdego</text><rect x="578" y="324" width="466" height="96" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="588" y="336" width="142" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="650" y="378" font-size="19" fill="#16324f">1</text><rect x="740" y="336" width="142" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="802" y="378" font-size="19" fill="#16324f">2</text><rect x="892" y="336" width="142" height="70" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="954" y="378" font-size="19" fill="#16324f">3</text><text x="578" y="470" font-size="21" fill="#16324f">Wolne miejsce dzieli się na trzy równe</text><text x="578" y="498" font-size="21" fill="#16324f">udziały — po jednym na element.</text><text x="32" y="572" font-size="21" fill="#16324f">flex-grow:2 przy pozostałych 1 dałoby pierwszemu elementowi podwójny</text><text x="32" y="600" font-size="21" fill="#16324f">udział; flex-shrink:0 z kolei zabrania skurczenia poniżej bazy.</text></g></svg>
