<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Semantyka opisuje rolę regionu</title><desc id="desc">Treść jest widoczna w kolejności header, main, footer. Ich znaczenie pomaga nawigacji; semantyczne tagi same nie dodają kolorów ani kolumn.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Semantyka opisuje rolę regionu</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;header&gt;&lt;h1&gt;Zielnik&lt;/h1&gt;&lt;/header&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;main&gt;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;p&gt;Opis roślin.&lt;/p&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/main&gt;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;footer&gt;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;p&gt;Szkolna pracownia&lt;/p&gt;</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/footer&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="207" font-size="40" fill="#16324f" font-weight="700">Zielnik</text><text x="582" y="272" font-size="26" fill="#16324f" >Opis roślin.</text><text x="582" y="345" font-size="26" fill="#16324f" >Szkolna pracownia</text><text x="582" y="426" font-size="21" fill="#16324f" >Region główny: Opis roślin.</text><text x="32" y="572" font-size="21" fill="#16324f" >Treść jest widoczna w kolejności header, main, footer. Ich znaczenie pomaga nawigacji;</text><text x="32" y="600" font-size="21" fill="#16324f" >semantyczne tagi same nie dodają kolorów ani kolumn.</text></g></svg>