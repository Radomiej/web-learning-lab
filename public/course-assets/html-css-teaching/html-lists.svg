<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Podlista należy do konkretnej pozycji</title><desc id="desc">Wewnętrzne ul znajduje się przed zamknięciem li Zioła. Dlatego Mięta jest dzieckiem tej pozycji, a Drzewa jej sąsiadem.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Podlista należy do konkretnej pozycji</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;ul&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;li&gt;Zioła</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;ul&gt;&lt;li&gt;Mięta&lt;/li&gt;&lt;/ul&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;/li&gt;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;li&gt;Drzewa&lt;/li&gt;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/ul&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="585" y="205" font-size="29" fill="#16324f" >• Zioła</text><text x="630" y="253" font-size="27" fill="#16324f" >◦ Mięta</text><text x="585" y="305" font-size="29" fill="#16324f" >• Drzewa</text><text x="32" y="572" font-size="21" fill="#16324f" >Wewnętrzne ul znajduje się przed zamknięciem li Zioła. Dlatego Mięta jest dzieckiem tej</text><text x="32" y="600" font-size="21" fill="#16324f" >pozycji, a Drzewa jej sąsiadem.</text></g></svg>