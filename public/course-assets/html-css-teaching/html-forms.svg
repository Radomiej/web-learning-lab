<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">for łączy etykietę z id pola</title><desc id="desc">for=&quot;roslina&quot; wskazuje input id=&quot;roslina&quot;. Kliknięcie napisu ustawia kursor w polu. name=&quot;plant&quot; nazywa wartość podczas wysyłania.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">for łączy etykietę z id pola</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;label for=&quot;roslina&quot;&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> Nazwa rośliny</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/label&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;input id=&quot;roslina&quot;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> name=&quot;plant&quot; type=&quot;text&quot;&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="206" font-size="28" fill="#16324f" >Nazwa rośliny</text><rect x="582" y="235" width="445" height="58" fill="#fff" rx="5" stroke="#1d4ed8" stroke-width="3"/><text x="598" y="275" font-size="30" fill="#1d4ed8" >│</text><text x="582" y="356" font-size="22" fill="#16324f" >Kliknięcie etykiety → fokus pola</text><text x="582" y="411" font-size="21" fill="#16324f" >Nazwa wysyłanych danych: plant</text><text x="32" y="572" font-size="21" fill="#16324f" >for=&quot;roslina&quot; wskazuje input id=&quot;roslina&quot;. Kliknięcie napisu ustawia kursor w polu.</text><text x="32" y="600" font-size="21" fill="#16324f" >name=&quot;plant&quot; nazywa wartość podczas wysyłania.</text></g></svg>