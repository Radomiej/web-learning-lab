<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Enter w pliku a br w akapicie</title><desc id="desc">Zwykły Enter między słowami daje odstęp. br wymusza przełamanie wiersza; drugi p zaczyna osobny akapit.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Enter w pliku a br w akapicie</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;p&gt;Mięta</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">rośnie szybko.&lt;/p&gt;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"></text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;p&gt;ul. Leśna 2&lt;br&gt;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">80-001 Gdańsk&lt;/p&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="200" font-size="26" fill="#16324f" >Mięta rośnie szybko.</text><text x="582" y="285" font-size="26" fill="#16324f" >ul. Leśna 2</text><text x="582" y="320" font-size="26" fill="#16324f" >80-001 Gdańsk</text><text x="582" y="420" font-size="20" fill="#16324f" >br rozpoczyna nową linię.</text><text x="32" y="572" font-size="21" fill="#16324f" >Zwykły Enter między słowami daje odstęp. br wymusza przełamanie wiersza; drugi p</text><text x="32" y="600" font-size="21" fill="#16324f" >zaczyna osobny akapit.</text></g></svg>