<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">grid-template-columns buduje dwuwymiarową siatkę</title><desc id="desc">Kontener .practice z display:grid i repeat(3,1fr) dostaje trzy równe kolumny; elementy wypełniają komórki wiersz po wierszu.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa"/><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">grid-template-columns buduje dwuwymiarową siatkę</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5">1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.practice {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  display: grid;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  grid-template-columns:</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">    repeat(3, 1fr);</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  gap: 12px;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="384" font-size="19" fill="#9bdcf5">fr to ułamek wolnej przestrzeni —</text><text x="50" y="414" font-size="19" fill="#9bdcf5">nie sztywne piksele.</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f">2. WIDOCZNY EFEKT</text><text x="660" y="170" font-size="17" fill="#b45309">1fr</text><text x="810" y="170" font-size="17" fill="#b45309">1fr</text><text x="960" y="170" font-size="17" fill="#b45309">1fr</text><rect x="578" y="182" width="466" height="270" fill="none" stroke="#7fa6c2" stroke-width="2" stroke-dasharray="8 6" rx="10"/><rect x="592" y="196" width="142" height="118" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="654" y="260" font-size="20" fill="#16324f">1</text><rect x="746" y="196" width="142" height="118" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="808" y="260" font-size="20" fill="#16324f">2</text><rect x="900" y="196" width="142" height="118" fill="#bae6fd" stroke="#16324f" stroke-width="2" rx="8"/><text x="962" y="260" font-size="20" fill="#16324f">3</text><rect x="592" y="326" width="142" height="112" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="654" y="387" font-size="20" fill="#16324f">4</text><rect x="746" y="326" width="142" height="112" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="808" y="387" font-size="20" fill="#16324f">5</text><rect x="900" y="326" width="142" height="112" fill="#e0f2fe" stroke="#16324f" stroke-width="2" rx="8"/><text x="962" y="387" font-size="20" fill="#16324f">6</text><text x="578" y="500" font-size="21" fill="#16324f">Kolumny i wiersze istnieją razem —</text><text x="578" y="528" font-size="21" fill="#16324f">nie trzeba imitować siatki flexem.</text><text x="32" y="572" font-size="21" fill="#16324f">minmax(100px, 1fr) ustawia każdej kolumnie dolne ograniczenie, więc</text><text x="32" y="600" font-size="21" fill="#16324f">siatka nie kurczy się poniżej czytelnej szerokości komórki.</text></g></svg>
