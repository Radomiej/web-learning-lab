<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">content-box: szerokość treści plus otoczenie</title><desc id="desc">Rysunek w skali 2:1. width nie obejmuje paddingu i border przy content-box. Treść ma 200px, a cała szerokość pudełka z ramką 228px; margin jest osobno.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">content-box: szerokość treści plus otoczenie</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">.card {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> box-sizing: content-box;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> width: 200px;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> padding: 12px;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> border: 2px solid navy;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="172" font-size="23" fill="#16324f" >width: 200px → sama treść</text><rect x="582" y="208" width="456" height="110" fill="#b9e5f8" stroke="navy" stroke-width="4"/><rect x="610" y="236" width="400" height="54" fill="#fff" /><text x="681" y="270" font-size="23" fill="#16324f" >treść 200px</text><text x="582" y="371" font-size="26" fill="#16324f" >200 + 12 + 12 + 2 + 2</text><text x="582" y="416" font-size="26" fill="#16324f" >= 228px z obramowaniem</text><text x="582" y="476" font-size="21" fill="#16324f" >Margines jest poza tym pomiarem.</text><text x="32" y="572" font-size="21" fill="#16324f" >Rysunek w skali 2:1. width nie obejmuje paddingu i border przy content-box. Treść ma</text><text x="32" y="600" font-size="21" fill="#16324f" >200px, a cała szerokość pudełka z ramką 228px; margin jest osobno.</text></g></svg>