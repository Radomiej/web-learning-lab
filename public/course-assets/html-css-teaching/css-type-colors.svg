<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">rem mnoży rozmiar fontu html</title><desc id="desc">Obie linie pokazano w tej samej skali. Przy font-size html równym 16px zmiana p z 1rem na 1.5rem powiększa litery z 16px do 24px.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">rem mnoży rozmiar fontu html</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. REGUŁA CSS</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">html { font-size: 16px; }</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">p { font-size: 1.5rem; }</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="180" font-size="21" fill="#16324f" >PRZED: 1rem = 16px</text><text x="582" y="225" font-size="16" fill="#16324f" >Mięta w doniczce</text><text x="582" y="320" font-size="21" fill="#16324f" >PO: 1.5rem = 24px</text><text x="582" y="370" font-size="24" fill="#16324f" >Mięta w doniczce</text><text x="582" y="445" font-size="26" fill="#16324f" >1.5 × 16px = 24px</text><text x="32" y="572" font-size="21" fill="#16324f" >Obie linie pokazano w tej samej skali. Przy font-size html równym 16px zmiana p z 1rem</text><text x="32" y="600" font-size="21" fill="#16324f" >na 1.5rem powiększa litery z 16px do 24px.</text></g></svg>