<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Tytuł karty i nagłówek to dwa miejsca</title><desc id="desc">title zmienia nazwę karty przeglądarki. h1 zmienia nagłówek wewnątrz strony. Zmiana title nie zmienia treści h1.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Tytuł karty i nagłówek to dwa miejsca</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. ZAPIS HTML</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;head&gt;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;title&gt;Pracownia — kontakt&lt;/title&gt;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/head&gt;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;body&gt;</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> &lt;h1&gt;Napisz do nas&lt;/h1&gt;</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">&lt;/body&gt;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><rect x="570" y="150" width="480" height="54" fill="#dbe7f1" rx="8"/><text x="584" y="184" font-size="21" fill="#16324f" >Pracownia — kontakt</text><text x="582" y="278" font-size="38" fill="#16324f" font-weight="700">Napisz do nas</text><text x="582" y="345" font-size="21" fill="#16324f" >↑ Treść dokumentu</text><text x="32" y="572" font-size="21" fill="#16324f" >title zmienia nazwę karty przeglądarki. h1 zmienia nagłówek wewnątrz strony. Zmiana</text><text x="32" y="600" font-size="21" fill="#16324f" >title nie zmienia treści h1.</text></g></svg>