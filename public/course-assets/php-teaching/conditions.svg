<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">Porównanie wybiera drogę</title><desc id="desc">1 · DANE I PYTANIE. $points = 7;. $points &gt;= 5   →   true Następnie: 2 · TRUE: BLOK IF. echo &quot;Zaliczone&quot;;. Ta instrukcja wykona się dla 7 punktów. Następnie: 3 · FALSE: BLOK ELSE. echo &quot;Spróbuj ponownie&quot;;. Ta droga wykonałaby się np. dla 3 punktów.</desc><rect width="960" height="676" rx="20" fill="#f5f3fb"/><g font-family="Arial, sans-serif"><text x="32" y="54" fill="#202039" font-size="31" font-weight="700">Porównanie wybiera drogę</text><text x="32" y="82" fill="#5b5970" font-size="18">PHP · przykład edukacyjny · kod → działanie → efekt</text><rect x="32" y="100" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="131" fill="#6250a6" font-size="19" font-weight="700">1 · DANE I PYTANIE</text><text x="56" y="175" fill="#202039" font-size="24" font-family="Consolas, monospace">$points = 7;</text><text x="56" y="215" fill="#42425b" font-size="21">$points &gt;= 5   →   true</text><path d="M480 251v22m-7-7 7 7 7-7 M480 260H16V540H27m-7-7 7 7-7 7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="284" width="896" height="144" rx="16" fill="#edf9f3" stroke="#c8c8e0"/><text x="56" y="315" fill="#6250a6" font-size="19" font-weight="700">2 · TRUE: BLOK IF</text><text x="56" y="359" fill="#202039" font-size="24" font-family="Consolas, monospace">echo &quot;Zaliczone&quot;;</text><text x="56" y="399" fill="#42425b" font-size="21">Ta instrukcja wykona się dla 7 punktów.</text><rect x="32" y="468" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="499" fill="#6250a6" font-size="19" font-weight="700">3 · FALSE: BLOK ELSE</text><text x="56" y="543" fill="#202039" font-size="24" font-family="Consolas, monospace">echo &quot;Spróbuj ponownie&quot;;</text><text x="56" y="583" fill="#42425b" font-size="21">Ta droga wykonałaby się np. dla 3 punktów.</text></g></svg>