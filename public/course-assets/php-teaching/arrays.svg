<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">Indeks prowadzi do elementu</title><desc id="desc">1 · KOLEKCJA. $skills = [&quot;HTML&quot;, &quot;CSS&quot;, &quot;PHP&quot;];. Jedna zmienna, trzy wartości. Następnie: 2 · INDEKSY OD ZERA. 0 → &quot;HTML&quot;     1 → &quot;CSS&quot;     2 → &quot;PHP&quot;. $skills[1] odczytuje drugi element. Następnie: 3 · WYNIK ODCZYTU. echo $skills[1];   →   CSS. foreach przechodzi po wszystkich elementach.</desc><rect width="960" height="676" rx="20" fill="#f5f3fb"/><g font-family="Arial, sans-serif"><text x="32" y="54" fill="#202039" font-size="31" font-weight="700">Indeks prowadzi do elementu</text><text x="32" y="82" fill="#5b5970" font-size="18">PHP · przykład edukacyjny · kod → działanie → efekt</text><rect x="32" y="100" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="131" fill="#6250a6" font-size="19" font-weight="700">1 · KOLEKCJA</text><text x="56" y="175" fill="#202039" font-size="24" font-family="Consolas, monospace">$skills = [&quot;HTML&quot;, &quot;CSS&quot;, &quot;PHP&quot;];</text><text x="56" y="215" fill="#42425b" font-size="21">Jedna zmienna, trzy wartości.</text><path d="M480 251v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="284" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="315" fill="#6250a6" font-size="19" font-weight="700">2 · INDEKSY OD ZERA</text><text x="56" y="359" fill="#202039" font-size="24" font-family="Consolas, monospace">0 → &quot;HTML&quot;     1 → &quot;CSS&quot;     2 → &quot;PHP&quot;</text><text x="56" y="399" fill="#42425b" font-size="21">$skills[1] odczytuje drugi element.</text><path d="M480 435v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="468" width="896" height="144" rx="16" fill="#edf9f3" stroke="#c8c8e0"/><text x="56" y="499" fill="#6250a6" font-size="19" font-weight="700">3 · WYNIK ODCZYTU</text><text x="56" y="543" fill="#202039" font-size="24" font-family="Consolas, monospace">echo $skills[1];   →   CSS</text><text x="56" y="583" fill="#42425b" font-size="21">foreach przechodzi po wszystkich elementach.</text></g></svg>