<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">return oddaje wynik, echo go wypisuje</title><desc id="desc">Argument 3 trafia do $count. Funkcja zwraca liczbę 15 do zmiennej $total. echo wstawia wynik do HTML i dopiero wtedy podgląd pokazuje Koszt: 15 zł.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">return oddaje wynik, echo go wypisuje</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. KOD PHP</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">function price($count) {</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> return $count * 5;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$total = price(3);</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">echo &quot;&lt;p&gt;Koszt: $total zł&lt;/p&gt;&quot;;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="177" font-size="26" fill="#16324f" >price(3) → $count = 3</text><text x="582" y="229" font-size="26" fill="#16324f" >3 × 5 → return 15</text><text x="582" y="281" font-size="26" fill="#16324f" >$total = 15</text><text x="582" y="339" font-size="21" fill="#16324f" >Samo return: brak napisu w HTML</text><rect x="582" y="370" width="445" height="92" fill="#eef5ff" rx="8"/><text x="601" y="426" font-size="30" fill="#16324f" >Koszt: 15 zł</text><text x="582" y="495" font-size="21" fill="#16324f" >Dopiero echo wypisuje akapit.</text><text x="32" y="572" font-size="21" fill="#16324f" >Argument 3 trafia do $count. Funkcja zwraca liczbę 15 do zmiennej $total. echo wstawia</text><text x="32" y="600" font-size="21" fill="#16324f" >wynik do HTML i dopiero wtedy podgląd pokazuje Koszt: 15 zł.</text></g></svg>