<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Wartość i typ to dwie informacje</title><desc id="desc">18 bez cudzysłowów jest liczbą całkowitą. &quot;018&quot; jest tekstem, nie liczbą; zachowuje 0. Wartość logiczna true nie jest napisem &quot;true&quot;.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Wartość i typ to dwie informacje</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. KOD PHP</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$age = 18;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$price = 12.50;</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$active = true;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$code = &quot;018&quot;;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="187" font-size="27" fill="#16324f" >$age → 18 · int</text><text x="582" y="257" font-size="27" fill="#16324f" >$price → 12.5 · float</text><text x="582" y="327" font-size="27" fill="#16324f" >$active → true · bool</text><text x="582" y="397" font-size="27" fill="#16324f" >$code → &quot;018&quot; · string</text><text x="582" y="472" font-size="21" fill="#16324f" >Tekst zachowuje początkowe zero.</text><text x="32" y="572" font-size="21" fill="#16324f" >18 bez cudzysłowów jest liczbą całkowitą. &quot;018&quot; jest tekstem, nie liczbą; zachowuje 0.</text><text x="32" y="600" font-size="21" fill="#16324f" >Wartość logiczna true nie jest napisem &quot;true&quot;.</text></g></svg>