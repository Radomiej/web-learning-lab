<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Odczyt $_POST nie gwarantuje tekstu</title><desc id="desc">?? daje pusty tekst dla brakującego klucza. Nie zmienia tablicy na tekst. is_string odrzuca name[]=Ala przed trim, a pusty tekst po trim wymaga komunikatu.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Odczyt $_POST nie gwarantuje tekstu</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. KOD PHP</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$raw = $_POST[&quot;name&quot;] ?? &quot;&quot;;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">if (!is_string($raw)) {</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> echo &quot;Niepoprawny format imienia&quot;;</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">} else {</text><text x="50" y="294" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> $name = trim($raw);</text><text x="50" y="324" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> if ($name === &quot;&quot;) {</text><text x="50" y="354" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">  echo &quot;Wpisz imię&quot;;</text><text x="50" y="384" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> }</text><text x="50" y="414" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="177" font-size="25" fill="#16324f" >name=Ala → &quot;Ala&quot;</text><text x="582" y="241" font-size="25" fill="#16324f" >Brak name → &quot;&quot;</text><text x="582" y="305" font-size="24" fill="#16324f" >Same spacje → trim → &quot;&quot;</text><text x="582" y="369" font-size="25" fill="#16324f" >name[]=Ala → tablica</text><text x="582" y="432" font-size="23" fill="#9f1239" >↓ is_string daje false</text><text x="582" y="478" font-size="23" fill="#16324f" >Odrzuć tablicę przed trim.</text><text x="32" y="572" font-size="21" fill="#16324f" >?? daje pusty tekst dla brakującego klucza. Nie zmienia tablicy na tekst. is_string</text><text x="32" y="600" font-size="21" fill="#16324f" >odrzuca name[]=Ala przed trim, a pusty tekst po trim wymaga komunikatu.</text></g></svg>