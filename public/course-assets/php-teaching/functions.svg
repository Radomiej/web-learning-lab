<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">Argument wchodzi, wynik wraca</title><desc id="desc">1 · WYWOŁANIE. $result = doublePoints(4);. Argument 4 trafia do parametru $points. Następnie: 2 · CIAŁO FUNKCJI. return $points * 2;. 4 * 2 → 8; return kończy to wywołanie. Następnie: 3 · POWRÓT DO WYWOŁANIA. $result = 8;   echo $result; → 8. return zwraca; dopiero echo wyświetla.</desc><rect width="960" height="676" rx="20" fill="#f5f3fb"/><g font-family="Arial, sans-serif"><text x="32" y="54" fill="#202039" font-size="31" font-weight="700">Argument wchodzi, wynik wraca</text><text x="32" y="82" fill="#5b5970" font-size="18">PHP · przykład edukacyjny · kod → działanie → efekt</text><rect x="32" y="100" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="131" fill="#6250a6" font-size="19" font-weight="700">1 · WYWOŁANIE</text><text x="56" y="175" fill="#202039" font-size="24" font-family="Consolas, monospace">$result = doublePoints(4);</text><text x="56" y="215" fill="#42425b" font-size="21">Argument 4 trafia do parametru $points.</text><path d="M480 251v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="284" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="315" fill="#6250a6" font-size="19" font-weight="700">2 · CIAŁO FUNKCJI</text><text x="56" y="359" fill="#202039" font-size="24" font-family="Consolas, monospace">return $points * 2;</text><text x="56" y="399" fill="#42425b" font-size="21">4 * 2 → 8; return kończy to wywołanie.</text><path d="M480 435v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="468" width="896" height="144" rx="16" fill="#edf9f3" stroke="#c8c8e0"/><text x="56" y="499" fill="#6250a6" font-size="19" font-weight="700">3 · POWRÓT DO WYWOŁANIA</text><text x="56" y="543" fill="#202039" font-size="24" font-family="Consolas, monospace">$result = 8;   echo $result; → 8</text><text x="56" y="583" fill="#42425b" font-size="21">return zwraca; dopiero echo wyświetla.</text></g></svg>