<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Poprawne zero nie jest błędem</title><desc id="desc">FILTER_VALIDATE_INT zwraca liczbę albo false. Ścisłe === false odróżnia poprawne 0 od błędu. Następnie sprawdzamy zakres 0–120; samo rzutowanie na int nie waliduje danych.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">Poprawne zero nie jest błędem</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. KOD PHP</text><text x="50" y="174" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$raw = $_POST[&quot;age&quot;] ?? &quot;&quot;;</text><text x="50" y="204" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$age = is_string($raw)</text><text x="50" y="234" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> ? filter_var($raw, FILTER_VALIDATE_INT)</text><text x="50" y="264" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> : false;</text><text x="50" y="294" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">if ($age === false || $age &lt; 0</text><text x="50" y="324" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">    || $age &gt; 120) {</text><text x="50" y="354" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> echo &quot;Podaj wiek od 0 do 120&quot;;</text><text x="50" y="384" font-size="17.95081967213115" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="182" font-size="20" fill="#16324f" >TEKST → WALIDACJA → WYNIK</text><text x="582" y="248" font-size="25" fill="#166534" >&quot;18&quot; → int 18 → poprawny</text><text x="582" y="315" font-size="25" fill="#9f1239" >&quot;abc&quot; → false → błąd</text><text x="582" y="382" font-size="25" fill="#166534" >&quot;0&quot; → int 0 → poprawny</text><text x="582" y="463" font-size="25" fill="#16324f" >0 === false daje false.</text><text x="32" y="572" font-size="21" fill="#16324f" >FILTER_VALIDATE_INT zwraca liczbę albo false. Ścisłe === false odróżnia poprawne 0 od</text><text x="32" y="600" font-size="21" fill="#16324f" >błędu. Następnie sprawdzamy zakres 0–120; samo rzutowanie na int nie waliduje danych.</text></g></svg>