<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">=== porównuje także typ</title><desc id="desc">Wyniki tych trzech var_dump to bool(true), bool(false), bool(true). Liczba 18 i tekst &quot;18&quot; nie są identyczne. == w tym przypadku konwertuje tekst liczbowy.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">=== porównuje także typ</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. KOD PHP</text><text x="50" y="174" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$age = 18;</text><text x="50" y="204" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">var_dump($age === 18);</text><text x="50" y="234" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">var_dump($age === &quot;18&quot;);</text><text x="50" y="264" font-size="20" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">var_dump($age == &quot;18&quot;);</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="183" font-size="26" fill="#16324f" >18 === 18</text><text x="862" y="183" font-size="27" fill="#166534" >true</text><text x="582" y="260" font-size="26" fill="#16324f" >18 === &quot;18&quot;</text><text x="862" y="260" font-size="27" fill="#9f1239" >false</text><text x="582" y="337" font-size="26" fill="#16324f" >18 == &quot;18&quot;</text><text x="862" y="337" font-size="27" fill="#166534" >true</text><text x="582" y="431" font-size="23" fill="#16324f" >===: ta sama wartość i typ</text><text x="582" y="473" font-size="23" fill="#16324f" >==: może przeliczyć typy</text><text x="32" y="572" font-size="21" fill="#16324f" >Wyniki tych trzech var_dump to bool(true), bool(false), bool(true). Liczba 18 i tekst</text><text x="32" y="600" font-size="21" fill="#16324f" >&quot;18&quot; nie są identyczne. == w tym przypadku konwertuje tekst liczbowy.</text></g></svg>