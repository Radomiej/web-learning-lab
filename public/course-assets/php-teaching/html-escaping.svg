<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">htmlspecialchars zachowuje dane jako tekst</title><desc id="desc">Encje &amp;lt; i &amp;gt; są interpretowane jako znaki tekstu, nie jako tagi. Użytkownik widzi dosłownie &lt;b&gt;Ala&lt;/b&gt;. Kodowanie wyjścia HTML nie jest ochroną zapytań SQL.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="52" font-size="30" fill="#16324f" font-weight="700">htmlspecialchars zachowuje dane jako tekst</text><rect x="28" y="84" width="494" height="448" fill="#16324f" rx="14"/><text x="50" y="124" font-size="19" fill="#9bdcf5" >1. KOD PHP</text><text x="50" y="174" font-size="19.94535519125683" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$name = &quot;&lt;b&gt;Ala&lt;/b&gt;&quot;;</text><text x="50" y="204" font-size="19.94535519125683" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">$safe = htmlspecialchars(</text><text x="50" y="234" font-size="19.94535519125683" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve"> $name, ENT_QUOTES, &quot;UTF-8&quot;</text><text x="50" y="264" font-size="19.94535519125683" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">);</text><text x="50" y="294" font-size="19.94535519125683" fill="#ffffff" font-family="Consolas, Courier New, monospace" xml:space="preserve">echo &quot;&lt;p&gt;Witaj, &quot; . $safe . &quot;!&lt;/p&gt;&quot;;</text><rect x="550" y="84" width="522" height="448" fill="#ffffff" rx="14" stroke="#b4c9da"/><text x="572" y="124" font-size="19" fill="#16324f" >2. WIDOCZNY EFEKT</text><text x="582" y="176" font-size="26" fill="#16324f" >Dane: &lt;b&gt;Ala&lt;/b&gt;</text><text x="582" y="235" font-size="22" fill="#16324f" >↓ kodowanie znaków &lt; i &gt;</text><text x="582" y="287" font-size="23" fill="#16324f" font-family="Consolas, monospace">&amp;lt;b&amp;gt;Ala&amp;lt;/b&amp;gt;</text><text x="582" y="347" font-size="22" fill="#16324f" >Podgląd HTML:</text><rect x="582" y="369" width="445" height="85" fill="#eef5ff" rx="8"/><text x="600" y="421" font-size="28" fill="#16324f" >Witaj, &lt;b&gt;Ala&lt;/b&gt;!</text><text x="582" y="494" font-size="21" fill="#16324f" >Ala pozostaje zwykłym tekstem.</text><text x="32" y="572" font-size="21" fill="#16324f" >Encje &amp;lt; i &amp;gt; są interpretowane jako znaki tekstu, nie jako tagi. Użytkownik widzi</text><text x="32" y="600" font-size="21" fill="#16324f" >dosłownie &lt;b&gt;Ala&lt;/b&gt;. Kodowanie wyjścia HTML nie jest ochroną zapytań SQL.</text></g></svg>