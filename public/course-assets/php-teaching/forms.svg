<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">Formularz PHP: od pola do odpowiedzi</title><desc id="desc">1 · HTML I ŻĄDANIE POST. &lt;input id=&quot;person&quot; name=&quot;name&quot; value=&quot;Ala&quot;&gt;. name → klucz name; id → etykieta / CSS / JS Następnie: 2 · PHP: ODCZYT I SPRAWDZENIE. $_POST[&quot;name&quot;] → &quot;Ala&quot; → trim → walidacja. Brak lub zły typ → komunikat, bez powodzenia. Następnie: 3 · ODPOWIEDŹ HTML. htmlspecialchars → echo → Witaj, Ala!. Na serwerze nowy HTML zastępuje widok strony.</desc><rect width="960" height="676" rx="20" fill="#f5f3fb"/><g font-family="Arial, sans-serif"><text x="32" y="54" fill="#202039" font-size="31" font-weight="700">Formularz PHP: od pola do odpowiedzi</text><text x="32" y="82" fill="#5b5970" font-size="18">PHP · przykład edukacyjny · kod → działanie → efekt</text><rect x="32" y="100" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="131" fill="#6250a6" font-size="19" font-weight="700">1 · HTML I ŻĄDANIE POST</text><text x="56" y="175" fill="#202039" font-size="24" font-family="Consolas, monospace">&lt;input id=&quot;person&quot; name=&quot;name&quot; value=&quot;Ala&quot;&gt;</text><text x="56" y="215" fill="#42425b" font-size="21">name → klucz name; id → etykieta / CSS / JS</text><path d="M480 251v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="284" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="315" fill="#6250a6" font-size="19" font-weight="700">2 · PHP: ODCZYT I SPRAWDZENIE</text><text x="56" y="359" fill="#202039" font-size="24" font-family="Consolas, monospace">$_POST[&quot;name&quot;] → &quot;Ala&quot; → trim → walidacja</text><text x="56" y="399" fill="#42425b" font-size="21">Brak lub zły typ → komunikat, bez powodzenia.</text><path d="M480 435v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="468" width="896" height="144" rx="16" fill="#edf9f3" stroke="#c8c8e0"/><text x="56" y="499" fill="#6250a6" font-size="19" font-weight="700">3 · ODPOWIEDŹ HTML</text><text x="56" y="543" fill="#202039" font-size="24" font-family="Consolas, monospace">htmlspecialchars → echo → Witaj, Ala!</text><text x="56" y="583" fill="#42425b" font-size="21">Na serwerze nowy HTML zastępuje widok strony.</text></g></svg>