<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">Pętla zmienia licznik po obiegu</title><desc id="desc">1 · START I WARUNEK. $i = 1;   $i &lt;= 3 → true. echo $i; wypisuje 1. Następnie: 2 · ZMIANA I KOLEJNE OBIEGI. $i++ → 2 → wypisz 2. $i++ → 3 → wypisz 3 Następnie: 3 · ZATRZYMANIE. $i++ → 4;   4 &lt;= 3 → false. Wynik trzech obiegów: 1 2 3</desc><rect width="960" height="676" rx="20" fill="#f5f3fb"/><g font-family="Arial, sans-serif"><text x="32" y="54" fill="#202039" font-size="31" font-weight="700">Pętla zmienia licznik po obiegu</text><text x="32" y="82" fill="#5b5970" font-size="18">PHP · przykład edukacyjny · kod → działanie → efekt</text><rect x="32" y="100" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="131" fill="#6250a6" font-size="19" font-weight="700">1 · START I WARUNEK</text><text x="56" y="175" fill="#202039" font-size="24" font-family="Consolas, monospace">$i = 1;   $i &lt;= 3 → true</text><text x="56" y="215" fill="#42425b" font-size="21">echo $i; wypisuje 1.</text><path d="M480 251v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="284" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="315" fill="#6250a6" font-size="19" font-weight="700">2 · ZMIANA I KOLEJNE OBIEGI</text><text x="56" y="359" fill="#202039" font-size="24" font-family="Consolas, monospace">$i++ → 2 → wypisz 2</text><text x="56" y="399" fill="#42425b" font-size="21">$i++ → 3 → wypisz 3</text><path d="M480 435v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="468" width="896" height="144" rx="16" fill="#edf9f3" stroke="#c8c8e0"/><text x="56" y="499" fill="#6250a6" font-size="19" font-weight="700">3 · ZATRZYMANIE</text><text x="56" y="543" fill="#202039" font-size="24" font-family="Consolas, monospace">$i++ → 4;   4 &lt;= 3 → false</text><text x="56" y="583" fill="#42425b" font-size="21">Wynik trzech obiegów: 1 2 3</text></g></svg>