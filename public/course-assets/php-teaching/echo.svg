<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">PHP tworzy odpowiedź</title><desc id="desc">1 · KOD PHP. &lt;?php. echo &quot;&lt;h2&gt;Witaj&lt;/h2&gt;&quot;; Następnie: 2 · TEKST ODPOWIEDZI. &lt;h2&gt;Witaj&lt;/h2&gt;. PHP zakończył pracę. Następnie: 3 · WIDOK PRZEGLĄDARKI. Witaj. HTML tworzy nagłówek h2.</desc><rect width="960" height="676" rx="20" fill="#f5f3fb"/><g font-family="Arial, sans-serif"><text x="32" y="54" fill="#202039" font-size="31" font-weight="700">PHP tworzy odpowiedź</text><text x="32" y="82" fill="#5b5970" font-size="18">PHP · przykład edukacyjny · kod → działanie → efekt</text><rect x="32" y="100" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="131" fill="#6250a6" font-size="19" font-weight="700">1 · KOD PHP</text><text x="56" y="175" fill="#202039" font-size="24" font-family="Consolas, monospace">&lt;?php</text><text x="56" y="215" fill="#42425b" font-size="21">echo &quot;&lt;h2&gt;Witaj&lt;/h2&gt;&quot;;</text><path d="M480 251v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="284" width="896" height="144" rx="16" fill="#fff" stroke="#c8c8e0"/><text x="56" y="315" fill="#6250a6" font-size="19" font-weight="700">2 · TEKST ODPOWIEDZI</text><text x="56" y="359" fill="#202039" font-size="24" font-family="Consolas, monospace">&lt;h2&gt;Witaj&lt;/h2&gt;</text><text x="56" y="399" fill="#42425b" font-size="21">PHP zakończył pracę.</text><path d="M480 435v22m-7-7 7 7 7-7" fill="none" stroke="#6250a6" stroke-width="3"/><rect x="32" y="468" width="896" height="144" rx="16" fill="#edf9f3" stroke="#c8c8e0"/><text x="56" y="499" fill="#6250a6" font-size="19" font-weight="700">3 · WIDOK PRZEGLĄDARKI</text><text x="56" y="543" fill="#202039" font-size="24" font-family="Consolas, monospace">Witaj</text><text x="56" y="583" fill="#42425b" font-size="21">HTML tworzy nagłówek h2.</text></g></svg>