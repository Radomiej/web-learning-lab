<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Props to dane od rodzica</title><desc id="desc">App przekazuje name z tekstem Lena. Hello odczytuje tę wartość i pokazuje Cześć, Lena!</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Props to dane od rodzica</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">function Hello({ name }) {</text><text x="50" y="194" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;p&gt;Cześć, {name}!&lt;/p&gt;;</text><text x="50" y="223" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="252" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">function App() {</text><text x="50" y="281" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;Hello name=&quot;Lena&quot; /&gt;;</text><text x="50" y="310" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="163" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="198" fill="#16324f" font-size="23" >App: &lt;Hello name=&quot;Lena&quot; /&gt;</text><text x="582" y="249" fill="#16324f" font-size="21" >↓ props = { name: &quot;Lena&quot; }</text><rect x="578" y="285" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="320" fill="#16324f" font-size="23" >Hello odczytuje props.name</text><text x="590" y="410" fill="#16324f" font-size="36" >Cześć, Lena!</text><text x="32" y="566" fill="#16324f" font-size="20" >App przekazuje name z tekstem Lena. Hello odczytuje tę wartość i pokazuje Cześć, Lena!</text></g></svg>