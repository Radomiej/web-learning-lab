<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Asynchroniczna praca wewnątrz efektu</title><desc id="desc">Cleanup starego efektu blokuje jego późny zapis do stanu. Jeśli najpierw wybrano Lenę, potem Jana, stara odpowiedź Leny nie nadpisze danych Jana.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Asynchroniczna praca wewnątrz efektu</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">let ignore = false;</text><text x="50" y="194" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">async function load() {</text><text x="50" y="223" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">  // fetch i odczyt JSON z kodu lekcji</text><text x="50" y="252" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">  if (!ignore) setProfile(data);</text><text x="50" y="281" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="310" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">load();</text><text x="50" y="339" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">return () =&gt; { ignore = true; };</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Żądanie A: userId=Lena</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >Zmiana na Jan → cleanup A: ignore=true</text><rect x="578" y="295" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="330" fill="#16324f" font-size="23" >Żądanie B: userId=Jan</text><rect x="578" y="365" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="400" fill="#16324f" font-size="23" >A wraca późno → ignoruj jego zapis</text><rect x="578" y="435" width="468" height="54" fill="#dcf3df" rx="7"/><text x="593" y="470" fill="#16324f" font-size="23" >B wraca → pokaż Jana</text><text x="32" y="566" fill="#16324f" font-size="20" >Cleanup starego efektu blokuje jego późny zapis do stanu. Jeśli najpierw wybrano Lenę,</text><text x="32" y="592" fill="#16324f" font-size="20" >potem Jana, stara odpowiedź Leny nie nadpisze danych Jana.</text></g></svg>