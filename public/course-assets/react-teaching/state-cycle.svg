<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Stan to pamięć komponentu</title><desc id="desc">Najpierw Punkty: 0. Po kliknięciu React przelicza widok z wartością 1 i przycisk pokazuje Punkty: 1.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Stan to pamięć komponentu</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">import { useState } from &quot;react&quot;;</text><text x="50" y="194" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">function Counter() {</text><text x="50" y="223" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const [count, setCount] = useState(0);</text><text x="50" y="252" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;button onClick={() =&gt; setCount(count + 1)}&gt;</text><text x="50" y="281" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">    Punkty: {count}</text><text x="50" y="310" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;/button&gt;;</text><text x="50" y="339" fill="#fff" font-size="13.60965047943087" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Render 1: count = 0</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >Przycisk: Punkty: 0</text><text x="582" y="315" fill="#16324f" font-size="21" >↓ klik → setCount(1) → kolejny render</text><rect x="578" y="355" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="390" fill="#16324f" font-size="23" >Render 2: count = 1</text><rect x="578" y="425" width="468" height="54" fill="#dcf3df" rx="7"/><text x="593" y="460" fill="#16324f" font-size="23" >Przycisk: Punkty: 1</text><text x="32" y="566" fill="#16324f" font-size="20" >Najpierw Punkty: 0. Po kliknięciu React przelicza widok z wartością 1 i przycisk pokazuje</text><text x="32" y="592" fill="#16324f" font-size="20" >Punkty: 1.</text></g></svg>