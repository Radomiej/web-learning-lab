<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Stan jest migawką konkretnego renderu</title><desc id="desc">Pierwsze wywołanie wypisze 0. Następny widok otrzyma 1. To nie dowód, że setter nie zadziałał.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Stan jest migawką konkretnego renderu</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="12.88056206088993" font-family="Consolas, Courier New, monospace" xml:space="preserve">// W komponencie: const [count, setCount] = useState(0);</text><text x="50" y="194" fill="#fff" font-size="12.88056206088993" font-family="Consolas, Courier New, monospace" xml:space="preserve">function handleClick() {</text><text x="50" y="223" fill="#fff" font-size="12.88056206088993" font-family="Consolas, Courier New, monospace" xml:space="preserve">  setCount(count + 1);</text><text x="50" y="252" fill="#fff" font-size="12.88056206088993" font-family="Consolas, Courier New, monospace" xml:space="preserve">  console.log(count);</text><text x="50" y="281" fill="#fff" font-size="12.88056206088993" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Handler ma migawkę count = 0</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >setCount(0 + 1): kolejny stan = 1</text><rect x="578" y="295" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="330" fill="#16324f" font-size="23" >console.log(count): wypisze 0</text><text x="582" y="382" fill="#16324f" font-size="21" >↓ dopiero kolejny render otrzyma count = 1</text><rect x="578" y="425" width="468" height="54" fill="#dcf3df" rx="7"/><text x="593" y="460" fill="#16324f" font-size="23" >Nowy stan: 1</text><text x="32" y="566" fill="#16324f" font-size="20" >Pierwsze wywołanie wypisze 0. Następny widok otrzyma 1. To nie dowód, że setter nie</text><text x="32" y="592" fill="#16324f" font-size="20" >zadziałał.</text></g></svg>