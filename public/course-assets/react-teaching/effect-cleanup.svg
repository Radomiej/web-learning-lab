<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">cleanup odwraca poprzednią synchronizację</title><desc id="desc">Zmiana delay zatrzymuje poprzedni timer przed uruchomieniem nowego. Aktualizator t=&gt;t+1 nie wymaga odczytywania tick w efekcie.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">cleanup odwraca poprzednią synchronizację</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">// Fragment komponentu z tick/setTick i propsem delay:</text><text x="50" y="194" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">useEffect(() =&gt; {</text><text x="50" y="223" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const id = setInterval(() =&gt; {</text><text x="50" y="252" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">    setTick(t =&gt; t + 1);</text><text x="50" y="281" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">  }, delay);</text><text x="50" y="310" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return () =&gt; clearInterval(id);</text><text x="50" y="339" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">}, [delay]);</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Setup: timer A · delay=1000</text><text x="582" y="249" fill="#16324f" font-size="21" >↓ prop delay zmienia się na 500</text><rect x="578" y="285" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="320" fill="#16324f" font-size="23" >Cleanup: clearInterval(A)</text><rect x="578" y="355" width="468" height="54" fill="#dcf3df" rx="7"/><text x="593" y="390" fill="#16324f" font-size="23" >Setup: timer B · delay=500</text><text x="582" y="465" fill="#16324f" font-size="21" >Po odmontowaniu: clearInterval(B).</text><text x="32" y="566" fill="#16324f" font-size="20" >Zmiana delay zatrzymuje poprzedni timer przed uruchomieniem nowego. Aktualizator t=&gt;t+1</text><text x="32" y="592" fill="#16324f" font-size="20" >nie wymaga odczytywania tick w efekcie.</text></g></svg>