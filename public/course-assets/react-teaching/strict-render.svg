<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">StrictMode podwaja wywołania, by wyłapać błędy</title><desc id="desc">console.log w renderze może pojawić się dodatkowo podczas pracy deweloperskiej. Nie zwiększaj licznika w renderze; rób to w obsłudze zdarzenia.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">StrictMode podwaja wywołania, by wyłapać błędy</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="15.680684248039915" font-family="Consolas, Courier New, monospace" xml:space="preserve">import { StrictMode } from &quot;react&quot;;</text><text x="50" y="194" fill="#fff" font-size="15.680684248039915" font-family="Consolas, Courier New, monospace" xml:space="preserve">// Fragment pliku startowego:</text><text x="50" y="223" fill="#fff" font-size="15.680684248039915" font-family="Consolas, Courier New, monospace" xml:space="preserve">root.render(&lt;StrictMode&gt;&lt;App /&gt;&lt;/StrictMode&gt;);</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Development + StrictMode</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >Render → dodatkowe wywołanie kontrolne</text><text x="582" y="320" fill="#16324f" font-size="21" >Czysty render nie dodaje punktów.</text><rect x="578" y="355" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="390" fill="#16324f" font-size="23" >To nie podwaja handlera kliknięcia.</text><text x="582" y="465" fill="#16324f" font-size="21" >Produkcja nie ma tych kontroli dev.</text><text x="32" y="566" fill="#16324f" font-size="20" >console.log w renderze może pojawić się dodatkowo podczas pracy deweloperskiej. Nie</text><text x="32" y="592" fill="#16324f" font-size="20" >zwiększaj licznika w renderze; rób to w obsłudze zdarzenia.</text></g></svg>