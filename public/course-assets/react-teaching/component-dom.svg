<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">React opisuje interfejs danymi</title><desc id="desc">Po zamontowaniu App użytkownik widzi nagłówek Pracownia. Samo zdefiniowanie funkcji jeszcze nie wyświetla strony.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">React opisuje interfejs danymi</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">function App() {</text><text x="50" y="194" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;h1&gt;Pracownia&lt;/h1&gt;;</text><text x="50" y="223" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="163" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="198" fill="#16324f" font-size="23" >Funkcja App zwraca JSX</text><text x="582" y="249" fill="#16324f" font-size="21" >↓ React oblicza opis i aktualizuje DOM</text><text x="590" y="330" fill="#16324f" font-size="40" font-weight="700">Pracownia</text><text x="582" y="425" fill="#16324f" font-size="21" >Widoczny wynik: element h1.</text><text x="32" y="566" fill="#16324f" font-size="20" >Po zamontowaniu App użytkownik widzi nagłówek Pracownia. Samo zdefiniowanie funkcji</text><text x="32" y="592" fill="#16324f" font-size="20" >jeszcze nie wyświetla strony.</text></g></svg>