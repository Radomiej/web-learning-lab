<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Wspólny stan trzymaj we wspólnym rodzicu</title><desc id="desc">Tekst i przycisk korzystają z jednego count w App. Po wydzieleniu komponentów stan nadal może pozostać w App.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Wspólny stan trzymaj we wspólnym rodzicu</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">function App() {</text><text x="50" y="194" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const [count, setCount] = useState(0);</text><text x="50" y="223" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;&gt;</text><text x="50" y="252" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">    &lt;p&gt;Suma: {count}&lt;/p&gt;</text><text x="50" y="281" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">    &lt;button onClick={() =&gt; setCount(c =&gt; c + 1)}&gt;Dodaj&lt;/button&gt;</text><text x="50" y="310" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;/&gt;;</text><text x="50" y="339" fill="#fff" font-size="11.449388498568826" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >App jest właścicielem: count=0</text><text x="582" y="249" fill="#16324f" font-size="21" >↓ ten sam count do obojga dzieci</text><rect x="578" y="285" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="320" fill="#16324f" font-size="23" >Widok: Suma: 0</text><rect x="578" y="355" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="390" fill="#16324f" font-size="23" >Przycisk → callback → setter w App</text><rect x="578" y="425" width="468" height="54" fill="#dcf3df" rx="7"/><text x="593" y="460" fill="#16324f" font-size="23" >Nowy count=1 → Suma: 1</text><text x="32" y="566" fill="#16324f" font-size="20" >Tekst i przycisk korzystają z jednego count w App. Po wydzieleniu komponentów stan nadal</text><text x="32" y="592" fill="#16324f" font-size="20" >może pozostać w App.</text></g></svg>