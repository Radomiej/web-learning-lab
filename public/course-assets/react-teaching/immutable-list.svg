<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">map aktualizuje wybrany obiekt</title><desc id="desc">Dla zadania id=7 done zmienia się z false na true. Inne zadania zachowują dane, a oryginalny obiekt zadania 7 nie jest mutowany.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">map aktualizuje wybrany obiekt</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">function toggleTask(id) {</text><text x="50" y="194" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">  setTasks(old =&gt; old.map(task =&gt;</text><text x="50" y="223" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">    task.id === id</text><text x="50" y="252" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">      ? { ...task, done: !task.done }</text><text x="50" y="281" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">      : task</text><text x="50" y="310" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">  ));</text><text x="50" y="339" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Przed: id=7 · done=false</text><text x="582" y="249" fill="#16324f" font-size="21" >↓ map + nowy obiekt {...task}</text><rect x="578" y="285" width="468" height="54" fill="#dcf3df" rx="7"/><text x="593" y="320" fill="#16324f" font-size="23" >Po: id=7 · done=true</text><rect x="578" y="355" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="390" fill="#16324f" font-size="23" >Inne zadania: te same dane</text><text x="582" y="465" fill="#16324f" font-size="21" >Stary obiekt id=7 nie jest mutowany.</text><text x="32" y="566" fill="#16324f" font-size="20" >Dla zadania id=7 done zmienia się z false na true. Inne zadania zachowują dane, a</text><text x="32" y="592" fill="#16324f" font-size="20" >oryginalny obiekt zadania 7 nie jest mutowany.</text></g></svg>