<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Efekt synchronizuje komponent ze światem</title><desc id="desc">Po zatwierdzeniu widoku z name=&quot;Lena&quot; efekt ustawia tytuł karty Profil: Lena. W zwykłym renderze nie zmieniamy document.title.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Efekt synchronizuje komponent ze światem</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">import { useEffect } from &quot;react&quot;;</text><text x="50" y="194" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">// W komponencie z propem name:</text><text x="50" y="223" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">useEffect(() =&gt; {</text><text x="50" y="252" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">  document.title = &quot;Profil: &quot; + name;</text><text x="50" y="281" fill="#fff" font-size="19.49490474080638" font-family="Consolas, Courier New, monospace" xml:space="preserve">}, [name]);</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >1. Render: JSX s name=&quot;Lena&quot;</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >2. Commit: DOM jest zaktualizowany</text><rect x="578" y="295" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="330" fill="#16324f" font-size="23" >3. Setup efektu: document.title = …</text><rect x="582" y="390" width="445" height="60" fill="#dbe7f1" rx="7"/><text x="599" y="429" fill="#16324f" font-size="29" >Profil: Lena</text><text x="582" y="492" fill="#16324f" font-size="21" >Efekt synchronizuje tytuł karty.</text><text x="32" y="566" fill="#16324f" font-size="20" >Po zatwierdzeniu widoku z name=&quot;Lena&quot; efekt ustawia tytuł karty Profil: Lena. W zwykłym</text><text x="32" y="592" fill="#16324f" font-size="20" >renderze nie zmieniamy document.title.</text></g></svg>