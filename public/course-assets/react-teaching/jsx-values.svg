<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Klamry wstawiają wartość JavaScript</title><desc id="desc">Akapit pokazuje Lena: 4, a jego title ma wartość Lena. Napisanie name bez klamer pokazałoby dosłownie name.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Klamry wstawiają wartość JavaScript</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">function App() {</text><text x="50" y="194" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const name = &quot;Lena&quot;;</text><text x="50" y="223" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const count = 3;</text><text x="50" y="252" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;p title={name}&gt;</text><text x="50" y="281" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">    {name}: {count + 1}</text><text x="50" y="310" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;/p&gt;;</text><text x="50" y="339" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="163" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="198" fill="#16324f" font-size="23" >name = &quot;Lena&quot; · count = 3</text><text x="582" y="249" fill="#16324f" font-size="21" >↓ {name} i {count + 1}</text><text x="590" y="330" fill="#16324f" font-size="36" >Lena: 4</text><text x="582" y="425" fill="#16324f" font-size="21" >title akapitu zawiera tekst Lena.</text><text x="32" y="566" fill="#16324f" font-size="20" >Akapit pokazuje Lena: 4, a jego title ma wartość Lena. Napisanie name bez klamer</text><text x="32" y="592" fill="#16324f" font-size="20" >pokazałoby dosłownie name.</text></g></svg>