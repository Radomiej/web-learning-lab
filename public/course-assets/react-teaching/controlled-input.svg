<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Kontrolowane pole pokazuje stan</title><desc id="desc">Wpisanie litery L uruchamia onChange, setter zapisuje L, a następny render przekazuje value=&quot;L&quot;.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Kontrolowane pole pokazuje stan</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">function NameField() {</text><text x="50" y="194" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const [name, setName] = useState(&quot;&quot;);</text><text x="50" y="223" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;label&gt;Imię</text><text x="50" y="252" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">    &lt;input value={name}</text><text x="50" y="281" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">      onChange={e =&gt; setName(e.target.value)} /&gt;</text><text x="50" y="310" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;/label&gt;;</text><text x="50" y="339" fill="#fff" font-size="15.027322404371585" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >1. Stan name = &quot;&quot; → puste pole</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >2. Uczeń wpisuje L</text><rect x="578" y="295" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="330" fill="#16324f" font-size="23" >3. onChange → setName(&quot;L&quot;)</text><rect x="578" y="365" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="400" fill="#16324f" font-size="23" >4. Nowy render → value=&quot;L&quot;</text><rect x="582" y="445" width="445" height="50" fill="#fff" rx="5" stroke="#1d4ed8" stroke-width="2"/><text x="597" y="479" fill="#16324f" font-size="25" >L│</text><text x="32" y="566" fill="#16324f" font-size="20" >Wpisanie litery L uruchamia onChange, setter zapisuje L, a następny render przekazuje</text><text x="32" y="592" fill="#16324f" font-size="20" >value=&quot;L&quot;.</text></g></svg>