<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">StrictMode sprawdza kompletność sprzątania</title><desc id="desc">Pod StrictMode na korzeniu w development można zobaczyć setup, cleanup, setup. [] nie znaczy obietnicy dokładnie jednego wywołania przez całe życie aplikacji.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">StrictMode sprawdza kompletność sprzątania</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">useEffect(() =&gt; {</text><text x="50" y="194" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">  console.log(&quot;setup&quot;);</text><text x="50" y="223" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return () =&gt; console.log(&quot;cleanup&quot;);</text><text x="50" y="252" fill="#fff" font-size="18.981880931837793" font-family="Consolas, Courier New, monospace" xml:space="preserve">}, []);</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Development · StrictMode na korzeniu</text><rect x="578" y="225" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="260" fill="#16324f" font-size="23" >1. Konsola: setup</text><rect x="578" y="295" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="330" fill="#16324f" font-size="23" >2. Konsola: cleanup</text><rect x="578" y="365" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="400" fill="#16324f" font-size="23" >3. Konsola: setup</text><text x="582" y="475" fill="#16324f" font-size="21" >Próba poprawności setup i cleanup.</text><text x="32" y="566" fill="#16324f" font-size="20" >Pod StrictMode na korzeniu w development można zobaczyć setup, cleanup, setup. [] nie</text><text x="32" y="592" fill="#16324f" font-size="20" >znaczy obietnicy dokładnie jednego wywołania przez całe życie aplikacji.</text></g></svg>