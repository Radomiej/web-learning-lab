<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">map tworzy nową tablicę wyników</title><desc id="desc">map zwraca nową tablicę dwóch opisów JSX. Po renderowaniu widać listę: Mięta i Bazylia. map sam nie tworzy węzłów DOM.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">map tworzy nową tablicę wyników</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">const plants = [</text><text x="50" y="194" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  { id: 7, name: &quot;Mięta&quot; },</text><text x="50" y="223" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  { id: 9, name: &quot;Bazylia&quot; }</text><text x="50" y="252" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">];</text><text x="50" y="281" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">return &lt;ul&gt;{plants.map(p =&gt;</text><text x="50" y="310" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">  &lt;li key={p.id}&gt;{p.name}&lt;/li&gt;</text><text x="50" y="339" fill="#fff" font-size="20" font-family="Consolas, Courier New, monospace" xml:space="preserve">)}&lt;/ul&gt;;</text><rect x="578" y="155" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="190" fill="#16324f" font-size="23" >Tablica danych: Mięta · Bazylia</text><text x="582" y="235" fill="#16324f" font-size="21" >↓ map → nowa tablica opisów JSX</text><rect x="578" y="267" width="468" height="54" fill="#e0f2fe" rx="7"/><text x="593" y="302" fill="#16324f" font-size="23" >[ &lt;li&gt;Mięta&lt;/li&gt;, &lt;li&gt;Bazylia&lt;/li&gt; ]</text><text x="582" y="352" fill="#16324f" font-size="21" >↓ React renderuje listę w DOM</text><text x="600" y="405" fill="#16324f" font-size="30" >• Mięta</text><text x="600" y="452" fill="#16324f" font-size="30" >• Bazylia</text><text x="582" y="510" fill="#16324f" font-size="21" >map nie tworzy węzłów DOM.</text><text x="32" y="566" fill="#16324f" font-size="20" >map zwraca nową tablicę dwóch opisów JSX. Po renderowaniu widać listę: Mięta i Bazylia.</text><text x="32" y="592" fill="#16324f" font-size="20" >map sam nie tworzy węzłów DOM.</text></g></svg>