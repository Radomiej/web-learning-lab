<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Ten sam hook daje każdemu własny stan</title><desc id="desc">Kliknięcie pierwszego przycisku zmienia tylko jego licznik: 0/0 → 1/0. Drugi ma własną pamięć.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="650" fill="#edf4fa" /><text x="32" y="50" fill="#16324f" font-size="29" font-weight="700">Ten sam hook daje każdemu własny stan</text><rect x="28" y="80" width="494" height="450" fill="#16324f" rx="14"/><rect x="550" y="80" width="522" height="450" fill="#fff" rx="14" stroke="#b4c9da"/><text x="50" y="120" fill="#9bdcf5" font-size="18" >1. KOD / FRAGMENT KOMPONENTU</text><text x="575" y="120" fill="#16324f" font-size="18" >2. PRZEBIEG I EFEKT</text><text x="50" y="165" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">function Counter() {</text><text x="50" y="194" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">  const { count, increment } = useCounter();</text><text x="50" y="223" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">  return &lt;button onClick={increment}&gt;{count}&lt;/button&gt;;</text><text x="50" y="252" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">}</text><text x="50" y="281" fill="#fff" font-size="13.357619914996965" font-family="Consolas, Courier New, monospace" xml:space="preserve">// Rodzic renderuje: &lt;&gt;&lt;Counter /&gt;&lt;Counter /&gt;&lt;/&gt;</text><text x="582" y="177" fill="#16324f" font-size="21" >Dwa użycia komponentu Counter:</text><rect x="582" y="205" width="205" height="70" fill="#e0f2fe" rx="8"/><rect x="822" y="205" width="205" height="70" fill="#e0f2fe" rx="8"/><text x="675" y="250" fill="#16324f" font-size="32" >0</text><text x="915" y="250" fill="#16324f" font-size="32" >0</text><text x="582" y="330" fill="#16324f" font-size="21" >↓ klik tylko w pierwszy</text><rect x="582" y="365" width="205" height="70" fill="#dcf3df" rx="8"/><rect x="822" y="365" width="205" height="70" fill="#e0f2fe" rx="8"/><text x="675" y="410" fill="#16324f" font-size="32" >1</text><text x="915" y="410" fill="#16324f" font-size="32" >0</text><text x="582" y="489" fill="#16324f" font-size="21" >Ten sam hook nie daje wspólnego stanu.</text><text x="32" y="566" fill="#16324f" font-size="20" >Kliknięcie pierwszego przycisku zmienia tylko jego licznik: 0/0 → 1/0. Drugi ma własną</text><text x="32" y="592" fill="#16324f" font-size="20" >pamięć.</text></g></svg>